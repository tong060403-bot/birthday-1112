<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>愿望收集 · to 小铭</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* 粉色浅色系，与主站一致 */
:root{--pink:#F27DA5;--rose:#E85D8A;--text:#6B4258;--light:#A3768D}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'ZCOOL KuaiLe','Yuanti SC','PingFang SC',sans-serif;
  background:linear-gradient(160deg,#FFF5F8,#FFE3EE);color:var(--text);
  min-height:100vh;padding:40px 20px 60px;
}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:26px;color:var(--rose);letter-spacing:6px;text-align:center;margin-bottom:8px}
.sub{text-align:center;font-size:14px;color:var(--light);letter-spacing:3px;margin-bottom:28px}
.stats{
  background:#fff;border:1.5px solid rgba(242,125,165,.5);border-radius:20px;
  padding:20px 24px;margin-bottom:24px;text-align:center;
  box-shadow:0 10px 30px rgba(242,125,165,.25);
}
.stats b{font-size:34px;color:var(--rose)}
ul{list-style:none}
li{
  background:#fff;border:1.5px solid rgba(242,125,165,.4);border-radius:16px;
  padding:16px 20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(242,125,165,.15);
}
li .t{font-size:16px;line-height:1.7;word-break:break-all}
li .ts{font-size:12px;color:var(--light);margin-top:6px;letter-spacing:1px}
.empty{text-align:center;color:var(--light);padding:40px 0;letter-spacing:3px}
a.back{display:block;text-align:center;margin-top:20px;color:var(--rose);letter-spacing:3px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 愿望收集站</h1>
  <div class="sub">to 小铭 · 生日愿望统计</div>
  <div class="stats">共收到 <b id="count">…</b> 个愿望</div>
  <ul id="list"><li class="empty">加载中…</li></ul>
  <a class="back" href="./">← 回到生日小站</a>
</div>
<script>
fetch('https://api.restful-api.dev/objects/ff808181a09d98f701a1d091b4231876')
  .then(r=>r.json())
  .then(idx=>{
    const wishes=((idx&&idx.data&&idx.data.list)||[])
      .slice().sort((a,b)=>b.ts-a.ts);
    document.getElementById('count').textContent=wishes.length;
    const ul=document.getElementById('list');
    if(!wishes.length){ul.innerHTML='<li class="empty">还没有愿望哦，去小站许一个吧 ✨</li>';return;}
    ul.innerHTML=wishes.map(w=>`<li><div class="t">${w.t.replace(/</g,'&lt;')}</div>
      <div class="ts">${w.ts?new Date(w.ts).toLocaleString('zh-CN'):'—'}</div></li>`).join('');
  })
  .catch(()=>{document.getElementById('list').innerHTML='<li class="empty">加载失败，请刷新重试</li>';});
</script>
</body>
</html>
